spring:
  application:
    name: springboot-minio

  datasource:
    # 本地 MySQL 8 使用 caching_sha2_password 时需要允许 JDBC 获取公钥；
    # 生产环境应改为启用 TLS 并配置证书，而不是沿用此本地开发默认值。
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/minio?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    # 密码只从终端环境变量读取，避免被写入项目或提交到仓库。
    password: ${MYSQL_PASSWORD:}
    driver-class-name: ${MYSQL_DRIVER:com.mysql.cj.jdbc.Driver}

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:sql/t_user_audio_history.sql,classpath:sql/t_user_tts_history.sql,classpath:sql/t_user_voiceprint_history.sql,classpath:sql/t_user_speaker_profile.sql,classpath:sql/t_user_meeting_note.sql,classpath:sql/t_user_meeting_segment.sql,classpath:sql/t_user_meeting_revision.sql,classpath:sql/t_user_auth_schema.sql,classpath:sql/t_knowledge_document.sql,classpath:sql/t_user_realtime_chat_history.sql
      data-locations: ${SQL_DATA_LOCATIONS:classpath:sql/t_user_auth_data.sql}

  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

server:
  port: ${SERVER_PORT:18080}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

minio:
  endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:19000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:user-bucket}

funasr:
  http-base-url: ${FUNASR_HTTP_BASE_URL:http://127.0.0.1:8002}
  asr-path: ${FUNASR_ASR_PATH:/asr}
  health-path: ${FUNASR_HEALTH_PATH:/}
  ws-url: ${FUNASR_WS_URL:ws://127.0.0.1:10095}
  connect-timeout-ms: ${FUNASR_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${FUNASR_READ_TIMEOUT_MS:60000}
  realtime-frame-duration-ms: ${FUNASR_REALTIME_FRAME_DURATION_MS:60}
  realtime-idle-timeout-ms: ${FUNASR_REALTIME_IDLE_TIMEOUT_MS:1500}
  realtime-overall-timeout-ms: ${FUNASR_REALTIME_OVERALL_TIMEOUT_MS:10000}

tts:
  http-base-url: ${TTS_HTTP_BASE_URL:http://127.0.0.1:8003}
  synthesize-path: ${TTS_SYNTHESIZE_PATH:/synthesize}
  health-path: ${TTS_HEALTH_PATH:/health}
  connect-timeout-ms: ${TTS_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${TTS_READ_TIMEOUT_MS:300000}

voiceprint:
  http-base-url: ${VOICEPRINT_HTTP_BASE_URL:http://127.0.0.1:8004}
  compare-path: ${VOICEPRINT_COMPARE_PATH:/verify}
  health-path: ${VOICEPRINT_HEALTH_PATH:/}
  connect-timeout-ms: ${VOICEPRINT_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${VOICEPRINT_READ_TIMEOUT_MS:300000}

realtime:
  gateway:
    # Required whenever the Python realtime gateway is enabled. Do not use a
    # default here: the gateway must not accept browser traffic without it.
    internal-key: ${REALTIME_GATEWAY_INTERNAL_KEY:}

knowledge:
  rag:
    base-url: ${RAG_SERVICE_URL:http://127.0.0.1:18082}
    connect-timeout-ms: ${RAG_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${RAG_READ_TIMEOUT_MS:30000}
