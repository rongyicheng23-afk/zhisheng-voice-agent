  <text x="1200" y="146" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="19" fill="#6D7EA3">依据当前项目核心数据表整理，适合放在“详细设计 / 数据库设计”章节</text>

