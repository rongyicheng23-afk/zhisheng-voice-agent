    <filter id="shellShadow" x="-40" y="-40" width="2480" height="1720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1F3865" flood-opacity="0.10"/>
