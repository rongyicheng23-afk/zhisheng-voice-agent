  <text x="1688" y="666" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#2F4B3A">segment_index / start_ms / end_ms</text>
  <text x="1688" y="698" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#2F4B3A">speaker_name / match_score / transcript</text>
  <text x="1688" y="730" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#2F4B3A">segment_bucket / segment_object / segment_filename</text>
