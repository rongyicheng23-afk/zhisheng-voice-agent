  <text x="1688" y="1138" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">keywords_json / todo_json</text>
  <text x="1688" y="1170" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">speaker_blocks_json / speaker_segments_json</text>
  <text x="1688" y="1202" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">create_time</text>
  <text x="1688" y="1248" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#8B6C4D">说明：采用 JSON 快照方式保存修订版本，</text>
  <text x="1688" y="1276" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#8B6C4D">便于人工校正、版本对比与回溯</text>

  <!-- note box -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="1322" width="1460" height="218" rx="28" fill="url(#tipPanel)" stroke="#DDE5F2" stroke-width="2"/>
  </g>
  <rect x="152" y="1350" width="230" height="42" rx="18" fill="#E9EEF8"/>
  <text x="267" y="1377" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#425271">设计说明</text>
  <text x="176" y="1426" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#4B5D83">1. 整体以用户表为核心，向各类历史表和纪要业务表形成一对多关系。</text>
  <text x="176" y="1464" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#4B5D83">2. 纪要主表、片段表、修订表构成“任务主线 + 片段细节 + 版本快照”的分层结构，兼顾查询效率与业务可读性。</text>
  <text x="176" y="1502" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#4B5D83">3. 音频文件本体统一存入 MinIO，对象路径保存在各业务表中，实现原始音频、结果音频与片段音频的统一追溯。</text>

  <!-- legend -->
  <g filter="url(#cardShadow)">
    <rect x="1630" y="1322" width="520" height="218" rx="28" fill="url(#tipPanel)" stroke="#DDE5F2" stroke-width="2"/>
  </g>
  <rect x="1662" y="1350" width="182" height="42" rx="18" fill="#E9EEF8"/>
  <text x="1753" y="1377" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#425271">关系说明</text>
  <text x="1688" y="1426" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#4B5D83">• 蓝色连线：用户与各业务历史表的一对多关系</text>
  <text x="1688" y="1464" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#4B5D83">• 绿色连线：纪要主表与片段表、档案表的业务关联</text>
  <text x="1688" y="1502" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#4B5D83">• 灰色虚线：版本快照和对象存储的结果回溯逻辑</text>

