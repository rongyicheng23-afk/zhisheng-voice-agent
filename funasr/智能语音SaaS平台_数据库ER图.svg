  <text x="1688" y="1010" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">PK  id</text>
  <text x="1688" y="1042" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">FK  meeting_id → t_user_meeting_note.id</text>
