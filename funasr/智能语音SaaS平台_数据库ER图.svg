      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="title" x1="780" y1="92" x2="1620" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A73FF"/>
      <stop offset="1" stop-color="#5BA3FF"/>
    </linearGradient>
    <linearGradient id="userPanel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EEF4FF"/>
