  <text x="1354" y="734" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#7B6A58">智能纪要任务主表</text>
  <line x1="1156" y1="756" x2="1552" y2="756" stroke="#F5DEBE" stroke-width="2"/>
  <text x="1180" y="792" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">PK  id</text>
  <text x="1180" y="824" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">FK  uid → t_user_info.id</text>
  <text x="1180" y="856" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">title / scene_type / selected_speaker_ids_json</text>
  <text x="1180" y="888" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">raw_bucket / raw_object / raw_filename</text>
  <text x="1180" y="920" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">full_transcript / summary_text</text>
  <text x="1180" y="952" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">keywords_json / todo_json / raw_result</text>
  <text x="1180" y="984" font-family="SFMono-Regular, Menlo, monospace" font-size="16" fill="#5A4430">status / error_message / timestamps</text>
  <text x="1180" y="1030" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#8B6C4D">说明：纪要的摘要、关键词、待办等核心内容</text>
  <text x="1180" y="1058" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#8B6C4D">统一挂接在主表上，便于任务查询与结果展示</text>

