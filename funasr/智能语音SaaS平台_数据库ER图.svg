      <path d="M0 0L14 7L0 14V0Z" fill="#2E9B62"/>
    </marker>
    <marker id="arrowGray" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14V0Z" fill="#7C8EAF"/>
    </marker>
