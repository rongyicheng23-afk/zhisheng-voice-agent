<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- subtle guide rails -->
  <line x1="120" y1="250" x2="1480" y2="250" stroke="#E8EEF7" stroke-width="2"/>
  <line x1="120" y1="600" x2="1480" y2="600" stroke="#E8EEF7" stroke-width="2"/>

  <!-- start node -->
  <rect x="120" y="390" width="120" height="120" rx="10" fill="#FFFFFF" stroke="#6B7C93" stroke-width="3"/>
  <rect x="145" y="415" width="70" height="70" rx="8" fill="#F7FAFF" stroke="#9DB3D2" stroke-width="2"/>

  <!-- branching arrows -->
  <path d="M240 450H300C340 450 340 250 380 250" stroke="#667788" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M240 450H300C340 450 340 600 380 600" stroke="#667788" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- arrowheads -->
  <path d="M365 242L380 250L365 258" stroke="#667788" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M365 592L380 600L365 608" stroke="#667788" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- upper real-time track -->
  <rect x="380" y="185" width="180" height="130" rx="12" fill="#FFFFFF" stroke="#7A8EA8" stroke-width="3"/>
