  <rect x="1395" y="390" width="120" height="120" rx="10" fill="#FFFFFF" stroke="#6A8FF0" stroke-width="3.5"/>
  <rect x="1423" y="418" width="64" height="64" rx="10" fill="#F6FAFF" stroke="#9DB3D2" stroke-width="2"/>

  <!-- final arrowheads -->
  <path d="M1380 442L1395 450L1380 458" stroke="#667788" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- subtle track tags as abstract bars, no text -->
  <rect x="380" y="140" width="900" height="20" rx="10" fill="#F6F9FE" stroke="#D6E0F0" stroke-width="1.5"/>
  <rect x="380" y="700" width="900" height="20" rx="10" fill="#F6F9FE" stroke="#D6E0F0" stroke-width="1.5"/>

  <!-- micro accents -->
  <circle cx="180" cy="450" r="6" fill="#6A8FF0"/>
  <circle cx="1455" cy="450" r="6" fill="#6A8FF0"/>
</svg>
