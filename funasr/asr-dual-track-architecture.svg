  <path d="M1280 250H1325C1360 250 1360 450 1395 450" stroke="#667788" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1280 600H1325C1360 600 1360 450 1395 450" stroke="#667788" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

