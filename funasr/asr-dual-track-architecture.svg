  <rect x="412" y="217" width="116" height="18" rx="6" fill="#ECF2FB"/>
  <rect x="412" y="247" width="96" height="12" rx="6" fill="#F3F7FD"/>
  <rect x="412" y="269" width="82" height="12" rx="6" fill="#F3F7FD"/>

  <rect x="652" y="217" width="116" height="18" rx="6" fill="#ECF2FB"/>
  <rect x="652" y="247" width="90" height="12" rx="6" fill="#F3F7FD"/>
  <rect x="652" y="269" width="106" height="12" rx="6" fill="#F3F7FD"/>

  <rect x="892" y="217" width="116" height="18" rx="6" fill="#ECF2FB"/>
  <rect x="892" y="247" width="96" height="12" rx="6" fill="#F3F7FD"/>
  <rect x="892" y="269" width="76" height="12" rx="6" fill="#F3F7FD"/>

  <rect x="1132" y="217" width="116" height="18" rx="6" fill="#EEF4FF"/>
  <rect x="1132" y="247" width="90" height="12" rx="6" fill="#F4F8FF"/>
  <rect x="1132" y="269" width="96" height="12" rx="6" fill="#F4F8FF"/>

  <!-- lower offline track -->
  <rect x="380" y="535" width="180" height="130" rx="12" fill="#FFFFFF" stroke="#7A8EA8" stroke-width="3"/>
  <rect x="620" y="535" width="180" height="130" rx="12" fill="#FFFFFF" stroke="#7A8EA8" stroke-width="3"/>
  <rect x="860" y="535" width="180" height="130" rx="12" fill="#FFFFFF" stroke="#7A8EA8" stroke-width="3"/>
  <rect x="1100" y="535" width="180" height="130" rx="12" fill="#F8FBFF" stroke="#6A8FF0" stroke-width="3.5"/>

