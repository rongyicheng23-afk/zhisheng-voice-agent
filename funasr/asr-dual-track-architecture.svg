  <path d="M560 250H620" stroke="#6B7C93" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M800 250H860" stroke="#6B7C93" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M1040 250H1100" stroke="#6A8FF0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M605 242L620 250L605 258" stroke="#6B7C93" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M845 242L860 250L845 258" stroke="#6B7C93" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1085 242L1100 250L1085 258" stroke="#6A8FF0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M560 600H620" stroke="#6B7C93" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M800 600H860" stroke="#6B7C93" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M1040 600H1100" stroke="#6A8FF0" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M605 592L620 600L605 608" stroke="#6B7C93" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M845 592L860 600L845 608" stroke="#6B7C93" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1085 592L1100 600L1085 608" stroke="#6A8FF0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

