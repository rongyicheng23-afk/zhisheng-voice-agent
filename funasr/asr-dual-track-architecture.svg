  <rect x="412" y="567" width="116" height="18" rx="6" fill="#ECF2FB"/>
  <rect x="412" y="597" width="98" height="12" rx="6" fill="#F3F7FD"/>
  <rect x="412" y="619" width="84" height="12" rx="6" fill="#F3F7FD"/>

  <rect x="652" y="567" width="116" height="18" rx="6" fill="#ECF2FB"/>
  <rect x="652" y="597" width="104" height="12" rx="6" fill="#F3F7FD"/>
  <rect x="652" y="619" width="88" height="12" rx="6" fill="#F3F7FD"/>

  <rect x="892" y="567" width="116" height="18" rx="6" fill="#ECF2FB"/>
  <rect x="892" y="597" width="92" height="12" rx="6" fill="#F3F7FD"/>
  <rect x="892" y="619" width="108" height="12" rx="6" fill="#F3F7FD"/>

  <rect x="1132" y="567" width="116" height="18" rx="6" fill="#EEF4FF"/>
  <rect x="1132" y="597" width="84" height="12" rx="6" fill="#F4F8FF"/>
  <rect x="1132" y="619" width="102" height="12" rx="6" fill="#F4F8FF"/>

