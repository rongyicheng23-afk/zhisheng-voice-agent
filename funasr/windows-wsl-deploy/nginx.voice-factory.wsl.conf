worker_processes  1;

events {
    worker_connections  1024;
}

http {
    default_type application/octet-stream;

    types {
        text/html html htm shtml;
        text/css css;
        text/xml xml;
        application/javascript js;
        application/json json;
        image/svg+xml svg svgz;
        image/png png;
        image/jpeg jpeg jpg;
        image/gif gif;
        font/woff woff;
        font/woff2 woff2;
        application/octet-stream bin;
    }

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    server {
        listen 8088;
        server_name localhost 127.0.0.1 voice.baconboat.cn;

        client_max_body_size 300m;

        # 部署到 WSL 后，如果你的路径不同，改这里。
        root /home/REPLACE_WITH_YOUR_WSL_USER/voice-factory/frontend/dist;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            expires -1;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/ {
            proxy_pass http://127.0.0.1:8080/user/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/funasr {
            proxy_pass http://127.0.0.1:8080/ws/funasr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            proxy_buffering off;
        }
    }
}
