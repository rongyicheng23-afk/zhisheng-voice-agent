<svg width="2200" height="1320" viewBox="0 0 2200 1320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #2d3e5e; }
    .subtitle { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; fill: #6b778c; }
    .st { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 13px; fill: #7a879d; }
    .name { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 22px; font-weight: 700; fill: #2c3e5c; }
    .field { font-family: Consolas, Menlo, monospace; font-size: 13px; fill: #344054; }
    .noteTitle { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 16px; font-weight: 700; fill: #4a5568; }
    .noteText { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; fill: #5f6c80; }
    .mul { font-family: Arial, "Microsoft YaHei", sans-serif; font-size: 14px; fill: #4a5a76; }
  </style>

  <rect width="2200" height="1320" fill="#FFFFFF"/>

  <text x="1100" y="58" text-anchor="middle" class="title">面向多场景交互的智能语音 SaaS 平台 UML 类图</text>
  <text x="1100" y="84" text-anchor="middle" class="subtitle">参考 diagrams.net / draw.io 的 UML 类图风格进行重绘，采用标准类框与关系标注表达数据库核心实体</text>

  <!-- UserInfo -->
  <g>
    <rect x="80" y="140" width="320" height="250" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="80" y1="190" x2="400" y2="190" stroke="#6B7280" stroke-width="1.5"/>
    <text x="240" y="162" text-anchor="middle" class="st">&lt;&lt;Entity&gt;&gt;</text>
    <text x="240" y="182" text-anchor="middle" class="name">UserInfo</text>
    <text x="100" y="222" class="field">+ id : int {PK}</text>
    <text x="100" y="250" class="field">+ username : varchar(64)</text>
    <text x="100" y="278" class="field">+ nick : varchar(64)</text>
    <text x="100" y="306" class="field">+ password : varchar(64)</text>
    <text x="100" y="334" class="field">+ phone : varchar(32)</text>
    <text x="100" y="362" class="field">+ email : varchar(128)</text>
  </g>

  <!-- Audio -->
  <g>
    <rect x="520" y="90" width="420" height="280" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="520" y1="140" x2="940" y2="140" stroke="#6B7280" stroke-width="1.5"/>
    <text x="730" y="112" text-anchor="middle" class="st">&lt;&lt;Entity&gt;&gt;</text>
    <text x="730" y="132" text-anchor="middle" class="name">UserAudioHistory</text>
    <text x="540" y="172" class="field">+ id : int {PK}</text>
    <text x="540" y="200" class="field">+ uid : int {FK}</text>
    <text x="540" y="228" class="field">+ original_filename : varchar(255)</text>
    <text x="540" y="256" class="field">+ request_mode : varchar(32)</text>
    <text x="540" y="284" class="field">+ funasr_mode : varchar(32)</text>
    <text x="540" y="312" class="field">+ status : varchar(32)</text>
    <text x="540" y="340" class="field">+ transcription : longtext</text>
  </g>

  <!-- TTS -->
  <g>
    <rect x="520" y="440" width="420" height="300" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="520" y1="490" x2="940" y2="490" stroke="#6B7280" stroke-width="1.5"/>
    <text x="730" y="462" text-anchor="middle" class="st">&lt;&lt;Entity&gt;&gt;</text>
    <text x="730" y="482" text-anchor="middle" class="name">UserTtsHistory</text>
    <text x="540" y="522" class="field">+ id : int {PK}</text>
    <text x="540" y="550" class="field">+ uid : int {FK}</text>
    <text x="540" y="578" class="field">+ input_text : text</text>
    <text x="540" y="606" class="field">+ emotion : varchar(32)</text>
    <text x="540" y="634" class="field">+ language : varchar(32)</text>
    <text x="540" y="662" class="field">+ source_object : varchar(255)</text>
    <text x="540" y="690" class="field">+ result_object : varchar(255)</text>
    <text x="540" y="718" class="field">+ status : varchar(32)</text>
  </g>

  <!-- Voiceprint -->
  <g>
    <rect x="520" y="810" width="420" height="270" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="520" y1="860" x2="940" y2="860" stroke="#6B7280" stroke-width="1.5"/>
    <text x="730" y="832" text-anchor="middle" class="st">&lt;&lt;Entity&gt;&gt;</text>
    <text x="730" y="852" text-anchor="middle" class="name">UserVoiceprintHistory</text>
    <text x="540" y="892" class="field">+ id : int {PK}</text>
    <text x="540" y="920" class="field">+ uid : int {FK}</text>
    <text x="540" y="948" class="field">+ left_object : varchar(255)</text>
    <text x="540" y="976" class="field">+ right_object : varchar(255)</text>
    <text x="540" y="1004" class="field">+ score : decimal(10,4)</text>
    <text x="540" y="1032" class="field">+ same_person : tinyint(1)</text>
  </g>

  <!-- Speaker -->
  <g>
    <rect x="1080" y="120" width="420" height="250" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="1080" y1="170" x2="1500" y2="170" stroke="#6B7280" stroke-width="1.5"/>
    <text x="1290" y="142" text-anchor="middle" class="st">&lt;&lt;Entity&gt;&gt;</text>
    <text x="1290" y="162" text-anchor="middle" class="name">UserSpeakerProfile</text>
    <text x="1100" y="202" class="field">+ id : int {PK}</text>
    <text x="1100" y="230" class="field">+ uid : int {FK}</text>
    <text x="1100" y="258" class="field">+ speaker_name : varchar(64)</text>
    <text x="1100" y="286" class="field">+ speaker_role : varchar(64)</text>
    <text x="1100" y="314" class="field">+ sample_object : varchar(255)</text>
    <text x="1100" y="342" class="field">+ status : varchar(32)</text>
  </g>

  <!-- MeetingNote -->
  <g>
    <rect x="1080" y="470" width="420" height="330" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="1080" y1="520" x2="1500" y2="520" stroke="#6B7280" stroke-width="1.5"/>
    <text x="1290" y="492" text-anchor="middle" class="st">&lt;&lt;Entity&gt;&gt;</text>
    <text x="1290" y="512" text-anchor="middle" class="name">UserMeetingNote</text>
    <text x="1100" y="552" class="field">+ id : int {PK}</text>
    <text x="1100" y="580" class="field">+ uid : int {FK}</text>
    <text x="1100" y="608" class="field">+ title : varchar(128)</text>
    <text x="1100" y="636" class="field">+ scene_type : varchar(32)</text>
    <text x="1100" y="664" class="field">+ selected_speaker_ids_json : text</text>
    <text x="1100" y="692" class="field">+ raw_object : varchar(255)</text>
    <text x="1100" y="720" class="field">+ full_transcript : longtext</text>
    <text x="1100" y="748" class="field">+ summary_text : text</text>
    <text x="1100" y="776" class="field">+ keywords_json / todo_json : text</text>
  </g>

  <!-- Segment -->
  <g>
    <rect x="1680" y="150" width="380" height="290" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="1680" y1="200" x2="2060" y2="200" stroke="#6B7280" stroke-width="1.5"/>
    <text x="1870" y="172" text-anchor="middle" class="st">&lt;&lt;Entity&gt;&gt;</text>
    <text x="1870" y="192" text-anchor="middle" class="name">UserMeetingSegment</text>
    <text x="1700" y="232" class="field">+ id : int {PK}</text>
    <text x="1700" y="260" class="field">+ meeting_id : int {FK}</text>
    <text x="1700" y="288" class="field">+ speaker_profile_id : int {FK?}</text>
    <text x="1700" y="316" class="field">+ segment_index : int</text>
    <text x="1700" y="344" class="field">+ start_ms / end_ms : bigint</text>
    <text x="1700" y="372" class="field">+ speaker_name : varchar(64)</text>
    <text x="1700" y="400" class="field">+ transcript : text</text>
  </g>

  <!-- Revision -->
  <g>
    <rect x="1680" y="560" width="380" height="330" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="1680" y1="610" x2="2060" y2="610" stroke="#6B7280" stroke-width="1.5"/>
    <text x="1870" y="582" text-anchor="middle" class="st">&lt;&lt;Entity&gt;&gt;</text>
    <text x="1870" y="602" text-anchor="middle" class="name">UserMeetingRevision</text>
    <text x="1700" y="642" class="field">+ id : int {PK}</text>
    <text x="1700" y="670" class="field">+ meeting_id : int {FK}</text>
    <text x="1700" y="698" class="field">+ version_no : int</text>
    <text x="1700" y="726" class="field">+ revision_type : varchar(32)</text>
    <text x="1700" y="754" class="field">+ title / summary_text : longtext</text>
    <text x="1700" y="782" class="field">+ full_transcript : longtext</text>
    <text x="1700" y="810" class="field">+ speaker_blocks_json : longtext</text>
    <text x="1700" y="838" class="field">+ speaker_segments_json : longtext</text>
    <text x="1700" y="866" class="field">+ create_time : datetime</text>
  </g>

  <!-- Notes -->
  <g>
    <rect x="80" y="1160" width="900" height="120" fill="#FFFFFF" stroke="#BFC8D6" stroke-width="1.5"/>
    <text x="100" y="1192" class="noteTitle">说明</text>
    <text x="100" y="1228" class="noteText">1. 用户实体是根实体，各类历史表、发言人档案和纪要任务都通过 uid 关联用户。</text>
    <text x="100" y="1260" class="noteText">2. 纪要业务拆成主表、片段表和版本快照表，支持结构化展示与人工修订回溯。</text>
  </g>

  <g>
    <rect x="1040" y="1160" width="1020" height="120" fill="#FFFFFF" stroke="#BFC8D6" stroke-width="1.5"/>
    <text x="1060" y="1192" class="noteTitle">关系说明</text>
    <text x="1060" y="1228" class="noteText">UserInfo 与 Audio / TTS / Voiceprint / SpeakerProfile / MeetingNote 为 1 对多。</text>
    <text x="1060" y="1260" class="noteText">MeetingNote 与 Segment / Revision 为 1 对多；SpeakerProfile 与 Segment 为可选关联。</text>
  </g>

  <!-- relationships -->
  <path d="M400 220H520" stroke="#5D6B89" stroke-width="2.5" fill="none"/>
  <text x="430" y="210" class="mul">1</text>
  <text x="500" y="210" class="mul">*</text>

  <path d="M400 270H470C520 270 520 590 520 590" stroke="#5D6B89" stroke-width="2.5" fill="none"/>
  <text x="430" y="258" class="mul">1</text>
  <text x="500" y="580" class="mul">*</text>

  <path d="M400 320H460C520 320 520 940 520 940" stroke="#5D6B89" stroke-width="2.5" fill="none"/>
  <text x="430" y="308" class="mul">1</text>
  <text x="500" y="930" class="mul">*</text>

  <path d="M400 240H740C920 240 1080 240 1080 240" stroke="#5D6B89" stroke-width="2.5" fill="none"/>
  <text x="430" y="230" class="mul">1</text>
  <text x="1060" y="230" class="mul">*</text>

  <path d="M400 350H700C900 350 1080 635 1080 635" stroke="#5D6B89" stroke-width="2.5" fill="none"/>
  <text x="430" y="340" class="mul">1</text>
  <text x="1060" y="626" class="mul">*</text>

  <path d="M1500 640H1580C1660 640 1680 300 1680 300" stroke="#5D6B89" stroke-width="2.5" fill="none"/>
  <text x="1520" y="628" class="mul">1</text>
  <text x="1660" y="290" class="mul">*</text>

  <path d="M1500 690H1580C1660 690 1680 720 1680 720" stroke="#5D6B89" stroke-width="2.5" fill="none"/>
  <text x="1520" y="678" class="mul">1</text>
  <text x="1660" y="710" class="mul">*</text>

  <path d="M1500 270H1600C1660 270 1680 288 1680 288" stroke="#5D6B89" stroke-width="2.5" stroke-dasharray="8 6" fill="none"/>
  <text x="1520" y="258" class="mul">1</text>
  <text x="1660" y="278" class="mul">0..*</text>
</svg>
