  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>

  <text x="106" y="118" fill="#8FA3DC" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="600">数据库设计 · 数据闭环</text>
  <text x="106" y="186" fill="#F7FAFF" font-size="58" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">智能语音平台</text>
  <text x="106" y="250" fill="#D8E3FF" font-size="30" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="600">采集 → 算法 → 入库 → 存储 → 回流</text>
  <text x="106" y="294" fill="#93A6D7" font-size="21" font-family="PingFang SC, Microsoft YaHei, sans-serif">输入、处理、历史与音频文件被统一串成一条可追溯业务主线。</text>

