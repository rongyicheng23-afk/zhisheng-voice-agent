<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="40" x2="1480" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071326"/>
      <stop offset="0.52" stop-color="#101B38"/>
      <stop offset="1" stop-color="#141E44"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 220) rotate(34) scale(500 320)">
      <stop stop-color="#4A8DFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#4A8DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1280 720) rotate(18) scale(420 260)">
      <stop stop-color="#7A67FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7A67FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58A4FF"/>
      <stop offset="1" stop-color="#7167FF"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65E0D5"/>
      <stop offset="1" stop-color="#53B5FF"/>
    </linearGradient>
